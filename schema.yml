            application/json:
              schema:
                $ref: '#/components/schemas/TokenVerify'
          description: ''
components:
  schemas:
    CreateEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        banner:
          type: string
          format: uri
          nullable: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        location:
          type: string
          maxLength: 255
        slug:
          type: string
          minLength: 2
          pattern: ^[-a-zA-Z0-9_]+$
        organization:
          type: string
          format: uuid
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
      required:
      - end_at
      - id
      - location
      - organization
      - slug
      - start_at
      - status
      - title
    CreateTicketType:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        event:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 120
        description:
          type: string
          maxLength: 300
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        quantity:
          type: integer
          maximum: 30000
          minimum: 1
        min_quantity_per_order:
          type: integer
          maximum: 100
          minimum: 1
        max_quantity_per_order:
          type: integer
          maximum: 100
          minimum: 1
        max_quantity_per_user:
          type: integer
          maximum: 100
          minimum: 1
        sales_start_at:
          type: string
          format: date-time
        sales_end_at:
          type: string
          format: date-time
        absorb_fee:
          type: boolean
      required:
      - event
      - id
      - max_quantity_per_order
      - max_quantity_per_user
      - min_quantity_per_order
      - quantity
      - sales_end_at
      - sales_start_at
      - title
    EditEvent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 1000
        banner:
          type: string
          format: uri
          nullable: true
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
        location:
          type: string
          maxLength: 255
        slug:
          type: string
          minLength: 2
          pattern: ^[-a-zA-Z0-9_]+$
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - end_at
      - id
      - location
      - slug
      - start_at
      - title
    EditOrganizationMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        role:
          $ref: '#/components/schemas/Role84fEnum'
        user:
          type: string
          format: uuid
          readOnly: true
      required:
      - id
      - role
      - user
    EventList:
      type: object
      properties:
        title:
          type: string
          maxLength: 100
        slug:
          type: string
          maxLength: 50
          minLength: 2
          pattern: ^[-a-zA-Z0-9_]+$
        banner:
          type: string
          format: uri
          nullable: true
        start_at:
          type: string
          format: date-time
        location:
          type: string
          maxLength: 255
        organization:
          allOf:
          - $ref: '#/components/schemas/OrganizationSummary'
          readOnly: true
      required:
      - location
      - organization
      - slug
      - start_at
      - title
    EventMember:
      type: object
      properties:
        user:
          type: string
          format: uuid
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/Role455Enum'
          readOnly: true
      required:
      - role
      - user
    EventPerfil:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        banner:
          type: string
          format: uri
          nullable: true
          readOnly: true
        start_at:
          type: string
          format: date-time
          readOnly: true
        end_at:
          type: string
          format: date-time
          readOnly: true
        location:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        organization:
          type: string
          format: uuid
          readOnly: true
      required:
      - banner
      - description
      - end_at
      - id
      - location
      - organization
      - slug
      - start_at
      - title
    InviteMemberInput:
      type: object
      properties:
